name: Build PTB Field Capture APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: |
          npm install
          npm install -D typescript

      - name: Ensure www folder exists
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PTB Field Capture</title>
  <style>
    body { font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#0f172a; color:#e2e8f0; }
    .card { text-align:center; padding:2rem; }
    h1 { margin:0 0 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PTB Field Capture</h1>
    <p>Pakistan Tobacco Board – Digital Track & Trace</p>
    <p>Offline-first field capture app</p>
  </div>
</body>
</html>' > www/index.html
          fi

      - name: Add Android platform & sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PTB_Field_Capture-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
